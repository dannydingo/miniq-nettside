<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176946"><title>Bokstavjakten – MiniQ</title><meta name="description" content="Velg en bokstav og oppdag filmer og aktivitetsark i Bokstavjakten."><style>
:root{--green:#176747;--ink:#173c2e}*{box-sizing:border-box}body{margin:0;background:#fffefa;font-family:ui-rounded,'Trebuchet MS',system-ui,sans-serif;color:var(--ink)}header{background:white;border-bottom:1px solid #edf3e9}header .inner{max-width:1320px;margin:auto;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}header img{display:block;width:145px}header a{color:var(--green);font-weight:800;text-decoration:none}.back{padding:10px 18px;border:1px solid #d3e7d4;border-radius:30px}main{max-width:1320px;margin:auto;padding:58px 28px 90px}.intro{text-align:center;margin:0 auto 48px;max-width:720px}.eyebrow{color:#a25d0c;text-transform:uppercase;font-weight:900;letter-spacing:.12em;font-size:13px}.intro h1{font-size:clamp(42px,5.2vw,67px);letter-spacing:-.045em;line-height:1.06;margin:14px 0}.intro p{color:#566d60;line-height:1.6;font-size:18px;margin:0}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:34px 17px}.card{text-align:center;min-width:0}.circle{aspect-ratio:1;width:100%;display:flex;position:relative;border:5px solid white;border-radius:50%;align-items:center;justify-content:center;overflow:hidden;text-decoration:none;background:#e4f2df;box-shadow:0 3px 0 #c7e0c7,0 9px 20px #164f2b1a}.card:nth-child(4n+2) .circle{background-color:#fff0d6;box-shadow:0 3px 0 #efd4aa,0 9px 20px #7655171a}.card:nth-child(4n+3) .circle{background-color:#e1f1f5;box-shadow:0 3px 0 #c6e3e9,0 9px 20px #164f2b1a}.card:nth-child(4n) .circle{background-color:#f0eaf8;box-shadow:0 3px 0 #ddd0ee,0 9px 20px #164f2b1a}.circle.has-video{background-position:center;background-size:cover;transition:transform .18s ease,box-shadow .18s ease}.circle.has-video:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#1b392348,#172b2185)}.circle.has-video:hover{transform:translateY(-4px);box-shadow:0 5px 0 #a4cda9,0 14px 22px #164f2b30}.letter{position:relative;font-size:clamp(45px,5.7vw,74px);font-weight:900;line-height:1;color:#27704d}.has-video .letter{color:white;text-shadow:0 3px 9px #000b,1px 1px 2px #000}.label{font-size:15px;font-weight:900;margin:13px 0 3px}.video-status{font-size:13px;color:#66806e;margin:0;min-height:22px}.worksheet{display:inline-block;color:#176747;font-weight:800;font-size:13px;text-decoration:underline;text-underline-offset:3px;line-height:1.35;margin-top:8px}.worksheet.disabled{color:#829389;text-decoration:none;font-weight:600}.play{position:absolute;bottom:12px;right:17px;border-radius:50%;width:30px;height:30px;background:#f8a52f;color:#183b2d;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px #0004}.circle:focus-visible,.worksheet:focus-visible,.back:focus-visible{outline:3px solid #f5a623;outline-offset:5px}footer{text-align:center;padding:24px;color:#6a806f;font-size:14px;border-top:1px solid #e6efe5}@media(max-width:1050px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:34px 20px}}@media(max-width:680px){main{padding:38px 18px 70px}.intro{margin-bottom:34px}.intro p{font-size:16px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 13px}.letter{font-size:55px}.circle{border-width:4px}.play{width:26px;height:26px;bottom:9px;right:10px}.label{font-size:14px}.worksheet{font-size:12px}header .inner{padding:13px 18px}header img{width:120px}}
dialog.player{border:0;border-radius:26px;padding:0;width:min(780px,calc(100% - 32px));max-height:calc(100% - 32px);box-shadow:0 24px 90px #092c1d66;color:#173c2e;background:#fff;overflow:auto}dialog.player::backdrop{background:rgba(10,37,23,.74)}.player-head{padding:22px 24px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px}.player-head h2{font-size:clamp(22px,4vw,30px);margin:0;letter-spacing:-.02em}.player-close{border:0;border-radius:50%;width:44px;height:44px;font-size:27px;background:#eef5eb;color:#176747;cursor:pointer;flex-shrink:0}.player-video{aspect-ratio:16/9;background:#102b20}.player-video iframe{width:100%;height:100%;border:0;display:block}.player-foot{padding:18px 24px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.player-foot p{margin:0;line-height:1.5;color:#52695b}.player-sheet{color:white;background:#176747;border-radius:30px;padding:12px 18px;font-weight:800;text-decoration:none}.player-sheet.disabled{background:#eef2ed;color:#718377}.circle{cursor:pointer;font-family:inherit}.circle:not(.has-video){cursor:default}.circle:focus-visible,.player-close:focus-visible,.player-sheet:focus-visible{outline:3px solid #f5a623;outline-offset:4px}@media(max-width:600px){.player-head{padding:17px 18px 13px}.player-foot{padding:16px 18px 20px}}
</style></head><body><header><div class="inner"><a href="index.html" aria-label="MiniQ hjem"><img src="logo.png" alt="MiniQ med Jo og Gege"></a><a class="back" href="index.html">Til forsiden</a></div></header><main><div class="intro"><div class="eyebrow">Se, lek og lær sammen</div><h1>Bokstavjakten</h1><p>Hvilken bokstav vil du oppdage i dag? Trykk på en bokstav for å se filmen her på siden, og last gjerne ned aktivitetsarket.</p></div><div class="grid" id="letters"></div></main><dialog class="player" aria-labelledby="player-title"><div class="player-head"><h2 id="player-title">Bokstavjakten</h2><button class="player-close" type="button" aria-label="Lukk filmen">×</button></div><div class="player-video" id="player-video"></div><div class="player-foot"><p>Se og lær sammen med MiniQ 💚</p><div id="player-sheet"></div></div></dialog><footer>MiniQ · Små oppdagere, store eventyr</footer><script>
const episodes={"A": "ctvUahgNhLk", "B": "a5BOmY7t7nI", "C": "yOkkXn5sAM0", "D": "s-3VQAk1d98", "E": "Dd2SqiuJy9I", "F": "lqiOxkr3Rz0", "G": "-E0Lf8It7EQ", "H": "Y73_2e04uyo", "I": "sqhvWF-iqRk", "J": "UG6it8rQy5c", "K": "wbjuIyM0GPI", "L": "_lFnRJGL_bw", "M": "XKJu1jCm_b0", "N": "dErFSvKP-uY", "O": "NrBUUL4LOtI", "P": "lFVeLv_3njY", "Q": "81LybJLgy3M", "R": "kOv31Oyy_2I", "S": "31utYSiiP58", "T": "hiaWws5cE-E", "U": "_-ofEm57LKw", "V": "77X-XIBuLH4", "W": "d0ArFf7ZAlw", "X": "su-x15kxJJc", "Y": "zZVtWcXRhxE", "Z": "ggoCmQeZe4M", "Æ": "f8ToqjIk9fI", "Ø": "rIDk7FyI-8k", "Å": "025Yf88Lp30"};
const worksheets={"A": "aktivitetsark-a.pdf", "B": "ark/01.pdf", "C": "ark/02.pdf", "D": "ark/03.pdf", "E": "ark/04.pdf", "F": "ark/05.pdf", "G": "ark/06.pdf", "H": "ark/07.pdf", "I": "ark/08.pdf", "J": "ark/09.pdf", "K": "ark/10.pdf", "L": "ark/11.pdf", "M": "ark/12.pdf", "N": "ark/13.pdf", "O": "ark/14.pdf", "P": "ark/15.pdf", "Q": "ark/16.pdf", "R": "ark/17.pdf", "S": "ark/18.pdf", "T": "ark/19.pdf", "U": "ark/20.pdf", "V": "ark/21.pdf", "W": "ark/22.pdf", "X": "ark/23.pdf", "Y": "ark/24.pdf", "Z": "ark/25.pdf", "Æ": "ark/26.pdf", "Ø": "ark/27.pdf", "Å": "ark/28.pdf"};
const grid=document.querySelector('#letters');
for(const letter of Array.from('ABCDEFGHIJKLMNOPQRSTUVWXYZÆØÅ')){const item=document.createElement('article');item.className='card';const episode=episodes[letter],worksheet=worksheets[letter];const circle=episode?`<button type="button" class="circle has-video" data-letter="${letter}" aria-label="Se filmen om bokstaven ${letter}" style="background-image:linear-gradient(180deg,#1b392348,#172b2185),url('https://i.ytimg.com/vi/${episode}/hqdefault.jpg')"><span class="letter">${letter}</span><span class="play" aria-hidden="true">▶</span></button>`:`<div class="circle" aria-label="Bokstaven ${letter}, film kommer"><span class="letter">${letter}</span></div>`;item.innerHTML=`${circle}<div class="label">Bokstaven ${letter}</div><p class="video-status">${episode?'Se filmen':'Film kommer'}</p>${worksheet?`<a class="worksheet" href="${worksheet}" download aria-label="Last ned aktivitetsark for ${letter}">Last ned aktivitetsark</a>`:'<span class="worksheet disabled">Aktivitetsark kommer</span>'}`;grid.append(item)}

const dialog=document.querySelector('.player');const video=document.querySelector('#player-video');const title=document.querySelector('#player-title');const sheet=document.querySelector('#player-sheet');let opener;
grid.addEventListener('click',e=>{const button=e.target.closest('button[data-letter]');if(!button)return;const letter=button.dataset.letter;opener=button;title.textContent=`Bokstaven ${letter}`;const frame=document.createElement('iframe');frame.title=`Bokstavjakten: Bokstaven ${letter}`;frame.src=`https://www.youtube-nocookie.com/embed/${episodes[letter]}?autoplay=1&playsinline=1&rel=0`;frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';frame.allowFullscreen=true;video.replaceChildren(frame);sheet.innerHTML=worksheets[letter]?`<a class="player-sheet" href="${worksheets[letter]}" download>Last ned aktivitetsark for ${letter}</a>`:'<span class="player-sheet disabled">Aktivitetsark kommer</span>';dialog.showModal();document.querySelector('.player-close').focus()});
document.querySelector('.player-close').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',()=>{video.replaceChildren();if(opener)opener.focus()});dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
</script></body></html>
