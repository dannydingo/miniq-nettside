<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176946">
  <meta name="description" content="Snu kort og finn like par med Jo og GG i MiniQs memoryspill.">
  <title>MiniQ – Memory med Jo og GG</title>
  <link rel="stylesheet" href="memory.css">
  <link rel="stylesheet" href="feiring.css">
  <script src="feiring.js" defer></script>
  <script src="memory.js" defer></script>
</head>
<body>
  <header class="page-header">
    <a href="index.html" aria-label="MiniQ hjem"><img src="logo.png" alt="MiniQ" width="132" height="57"></a>
    <a class="back-link" href="spill.html">Tilbake til spill</a>
  </header>
  <main>
    <section class="game-shell" aria-labelledby="game-title">
      <div class="intro">
        <div>
          <h1 id="game-title">Memory <span>med Jo og GG</span></h1>
          <p>Snu to kort. Finner du to like?</p>
        </div>
        <div class="friends">
          <img src="memory-assets/jo.webp" alt="Jo" width="80" height="80">
          <img src="memory-assets/gg.webp" alt="GG" width="80" height="80">
        </div>
      </div>
      <div class="play-area">
        <div class="toolbar">
          <label class="size-label" for="deck-size">Brettstørrelse
            <select id="deck-size">
              <option value="4">4 par</option>
              <option value="6">6 par</option>
            </select>
          </label>
          <span class="score" id="memory-score">0 av 4 par</span>
          <button class="restart" id="restart" type="button">Ny runde</button>
        </div>
        <div class="victory memory-victory" id="victory" hidden>
          <span class="victory-badge" aria-hidden="true">⭐</span>
          <div class="victory-copy">
            <strong id="victory-title"></strong>
            <p>Jo og GG feirer med deg!</p>
          </div>
        </div>
        <div class="board" id="memory-board" role="group" aria-label="Memorykort"></div>
        <p class="message" id="memory-message" role="status" aria-atomic="true">Velg et kort!</p>
        <noscript><p>Slå på JavaScript i nettleseren for å spille.</p></noscript>
      </div>
    </section>
  </main>
</body>
</html>
